<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
        }

        .login{
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        input{
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 200px;
        }

        button{
            padding: 10px;
            width: 100px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover{
            background: rgba(0, 128, 0, 0.815);
        }


    </style>
</head>
<body>
    <div class="login">
        <h2>login</h2>

        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password"  id="senha" placeholder="Senha">

        <button onclick="logar()">Entrar</button>

        <p id="msg"></p>
        
    </div>    

        <script>


            function logar(){

             let usuario = document.getElementById("usuario").value
             let senha = document.getElementById("senha").value

             fetch("http://localhost:3000/login",{
             method:"POST",
             headers:{
             "Content-Type":"application/json"
             },
             body:JSON.stringify({
             usuario:usuario,
             senha:senha
             })
             })
             .then(res => res.json())
             .then(dados => {
             document.getElementById("msg").innerText = dados.mensagem
             console.log(dados)
             })
            }

        </script>

    
    
</body>
</html>
