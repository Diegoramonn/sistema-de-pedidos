<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Sistema de Pedidos</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
   
    <div class="container">

        <h2>Painel de vendas</h2>

        <div class="painel">
           <div class="card">
               <h3>Total de Pedidos</h3>
               <p id="totalPedidos">0</p>
            </div>

           <div class="card">
             <h3>Total de Produtos</h3>
             <p id="totalProdutos">0</p>
            </div>

           <div class="card">
             <h3>Total Vendido</h3>
             <p id="totalVendido">0</p>
            </div>

        </div>




     <h1>Sistema de Pedidos</h1>

     <input id="cliente" type="text" placeholder="Cliente" >
     <input id="produto" type="text" placeholder="Produto">
     <input id="quantidade" type="number" placeholder="Quantidade">
     <input id="preco" type="number" placeholder="Preço"  >

      <button onclick="enviarPedido()">Enviar Pedido</button>

     <h2>Pedidos</h2>

     <table border="1" width="600">
     <thead>
        <tr>
            <th>Cliente</th>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
            <th>Total</th>
            <th>Ações</th>
        </tr>

     </thead>


     <tbody id="lista"></tbody>

     


     </table>

     <ul id="lista"></ul>


    </div>
    



 <script src="script.js"></script>

</body>
</html>
